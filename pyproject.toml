[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hkjc-benter-engine"
version = "0.1.0"
description = "Parimutuel pricing engine for the Hong Kong Jockey Club — dual XGBoost ensemble, Beta calibration, and Benter log-linear stacking."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "HKJC Benter Engine contributors" }]

dependencies = [
    "pandas>=2.3",
    "numpy>=2.4",
    "scipy>=1.16",
    "scikit-learn>=1.6",
    "xgboost>=3.2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "lxml>=6.0",
    "playwright>=1.40",
    "playwright-stealth>=2.0",
    "trueskill>=0.4",
    "discord-webhook>=1.4",
    "matplotlib>=3.10",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/hkjc-benter-engine"
Issues = "https://github.com/YOUR_USERNAME/hkjc-benter-engine/issues"

[tool.setuptools.packages.find]
where = ["src"]
