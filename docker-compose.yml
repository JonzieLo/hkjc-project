# Local-dev services. Values come from .env in the repo root.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: hkjc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HKJC_DB_USER:-hkjc}
      POSTGRES_PASSWORD: ${HKJC_DB_PASSWORD:?HKJC_DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${HKJC_DB_NAME:-hkjc_racing}
    ports:
      - "5432:5432"
    volumes:
      - hkjc_pgdata:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: hkjc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hkjc_redisdata:/data
volumes:
  hkjc_pgdata:
  hkjc_redisdata:
